# Variante mit fertigem Image aus ghcr.io (statt lokal zu bauen):
#   docker compose -f docker-compose.image.yml up -d
# Das Image wird von .github/workflows/docker.yml gebaut (ghcr.io/juloc/julos).
name: julos

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: julos
      POSTGRES_USER: julos
      POSTGRES_PASSWORD: "${JULOS_DB_PASSWORD:?Bitte JULOS_DB_PASSWORD in .env setzen (zum Beispiel: openssl rand -hex 16)}"
    volumes:
      - julos-postgres:/var/lib/postgresql
    # kein veroeffentlichter Port: nur der Server im internen Netz erreicht die Datenbank
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julos -d julos"]
      interval: 5s
      timeout: 3s
      retries: 20

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    # kein veroeffentlichter Port: guacd ist nur fuer den Server im internen Netz erreichbar
    extra_hosts:
      - "host.docker.internal:host-gateway"

  julos:
    image: ghcr.io/juloc/julos:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      JULOS_DB: "Host=postgres;Database=julos;Username=julos;Password=${JULOS_DB_PASSWORD}"
      JULOS_GUACD: guacd:4822
      # optional: Schluessel zum Speichern von Verbindungs-Passwoertern (openssl rand -base64 32); ohne ihn wird nichts gespeichert
      JULOS_SECRET_KEY: "${JULOS_SECRET_KEY:-}"
      # optional: Verbindungsziele auf diese Namen oder Adressen beschraenken (kommagetrennt)
      JULOS_ALLOWED_HOSTS: "${JULOS_ALLOWED_HOSTS:-}"
      # optional: Proxys, deren X-Forwarded-* geglaubt wird (Standard: alle privaten Netze)
      JULOS_TRUSTED_PROXIES: "${JULOS_TRUSTED_PROXIES:-}"
      # Taegliche Sicherung (Datenbank + Schluessel) nach /backup, siehe docs/BACKUP.md. Leer = an, sobald /backup eingebunden ist; off schaltet ab.
      JULOS_BACKUP: "${JULOS_BACKUP:-}"
      JULOS_BACKUP_TIME: "${JULOS_BACKUP_TIME:-}"
      JULOS_BACKUP_KEEP_DAYS: "${JULOS_BACKUP_KEEP_DAYS:-}"
      JULOS_BACKUP_KEY: "${JULOS_BACKUP_KEY:-}"
    # Der Server muss als derselbe Benutzer laufen wie die grafische Sitzung der Ziel-Maschine (Agent-Socket, Foto-Ordner)
    user: "${JULOS_UID:-1000}:${JULOS_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/julos-uploads:/uploads
      # Backup-Ordner: vorher anlegen (mkdir -m 700 ~/julos-backup), er gehoert dem Benutzer des Servers; Ablageort ausserhalb dieses Rechners mitnehmen
      - ${JULOS_BACKUP_PATH:-${HOME}/julos-backup}:/backup
    # BIND_IP = LAN-Adresse des Docker-Hosts (nur Heimnetz); Standard ist nur lokal (127.0.0.1)
    ports:
      - "${BIND_IP:-127.0.0.1}:${BIND_PORT:-8080}:8080"

volumes:
  julos-postgres:
