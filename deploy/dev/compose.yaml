# Test-Instanz: dieselbe Zusammenstellung wie live (Datenbank, guacd, Server aus demselben Dockerfile),
# dazu Wegwerf-Ziele zum Verbinden. Nur lokal erreichbar, eigene Datenbank, eigene Zugangsdaten (deploy/dev/up.sh erzeugt sie).
name: julos-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: julos
      POSTGRES_USER: julos
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?mit deploy/dev/up.sh starten}
    volumes:
      - julos-dev-postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:45432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julos -d julos"]
      interval: 3s
      timeout: 3s
      retries: 20

  guacd:
    image: guacamole/guacd:1.6.0
    # nur lokal, damit die Tests (deploy/dev/test.sh) den Relay gegen ein echtes guacd pruefen koennen
    ports:
      - "127.0.0.1:44822:4822"

  julos:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JULOS_DB: Host=postgres;Database=julos;Username=julos;Password=${DEV_DB_PASSWORD}
    ports:
      - "127.0.0.1:18080:8080"

  # Wegwerf-Ziel fuer das Terminal (SSH). Zugang: Benutzer "tester", Passwort aus deploy/dev/.env (DEV_TARGET_PASSWORD)
  test-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin
      USER_NAME: tester
      USER_PASSWORD: ${DEV_TARGET_PASSWORD}
      PASSWORD_ACCESS: "true"

  # Wegwerf-Ziel fuer den Desktop (RDP mit xrdp und XFCE, wie die Linux-VM). Fester Test-Zugang "ubuntu" / "ubuntu";
  # es gibt keinen veroeffentlichten Port, nur guacd im selben Netz erreicht es (Host "rdp-target", Port 3389).
  rdp-target:
    image: scottyhardy/docker-remote-desktop:latest
    hostname: rdp-target
    shm_size: 1g

volumes:
  julos-dev-postgres:
