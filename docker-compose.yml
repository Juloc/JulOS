name: julos

services:
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    # kein veroeffentlichter Port: guacd ist nur fuer das Gateway im internen Netz erreichbar
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      PORT: "8080"
      TOKEN_KEY: "${TOKEN_KEY}"
      GUACD_HOST: guacd
      RDP_HOST: "${RDP_HOST:-host.docker.internal}"
      RDP_PORT: "${RDP_PORT:-3389}"
      RDP_USER: "${RDP_USER:?Bitte RDP_USER in .env setzen (Linux-Benutzer der VM)}"
      PROXY_SECRET: "${PROXY_SECRET:-}"
      UPLOAD_DIR: /uploads
      AGENT_SOCKET: /uploads/.agent/agent.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gateway/public:/app/public:ro
      - ${HOME}/julos-uploads:/uploads
    # BIND_IP = LAN-Adresse des Docker-Hosts (nur Heimnetz); Standard ist nur lokal (127.0.0.1)
    ports:
      - "${BIND_IP:-127.0.0.1}:${BIND_PORT:-8080}:8080"
