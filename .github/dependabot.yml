# Haelt Abhaengigkeiten aktuell (Sicherheitsupdates kommen bei Dependabot ohnehin sofort, unabhaengig vom Zeitplan hier).
# Aktionen sind auf Commit-SHA gepinnt: Dependabot hebt den SHA und den Kommentar mit der Version an. Siehe docs/RELEASING.md "Updates und Sicherheit".
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      microsoft-runtime:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
