# JulOS: Server (.NET) und PostgreSQL. Baut das Image lokal; die Variante mit fertigem Image steht in docker-compose.image.yml.
name: julos

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: julos
      POSTGRES_USER: julos
      POSTGRES_PASSWORD: "${JULOS_DB_PASSWORD:?Bitte JULOS_DB_PASSWORD in .env setzen (zum Beispiel: openssl rand -hex 16)}"
    volumes:
      - julos-postgres:/var/lib/postgresql
    # kein veroeffentlichter Port: nur der Server im internen Netz erreicht die Datenbank
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julos -d julos"]
      interval: 5s
      timeout: 3s
      retries: 20

  julos:
    build: .
    image: ghcr.io/juloc/julos:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      julos-data-init:
        condition: service_completed_successfully
      codex:
        condition: service_started
    environment:
      JULOS_DB: "Host=postgres;Database=julos;Username=julos;Password=${JULOS_DB_PASSWORD}"
      # optional: Schluessel zum Speichern von Verbindungs-Passwoertern (openssl rand -base64 32); ohne ihn wird nichts gespeichert
      JULOS_SECRET_KEY: "${JULOS_SECRET_KEY:-}"
      # optional: Verbindungsziele auf diese Namen oder Adressen beschraenken (kommagetrennt)
      JULOS_ALLOWED_HOSTS: "${JULOS_ALLOWED_HOSTS:-}"
      # optional: Proxys, deren X-Forwarded-* geglaubt wird (Standard: alle privaten Netze)
      JULOS_TRUSTED_PROXIES: "${JULOS_TRUSTED_PROXIES:-}"
      # Taegliche Sicherung (Datenbank + Schluessel) nach /backup, siehe docs/BACKUP.md. Leer = an, sobald /backup eingebunden ist; off schaltet ab.
      JULOS_BACKUP: "${JULOS_BACKUP:-}"
      JULOS_BACKUP_TIME: "${JULOS_BACKUP_TIME:-}"
      JULOS_BACKUP_KEEP_DAYS: "${JULOS_BACKUP_KEEP_DAYS:-}"
      JULOS_BACKUP_KEY: "${JULOS_BACKUP_KEY:-}"
      # Zweites Ziel ausserhalb des Rechners (optional, Standard aus, docs/BACKUP.md): off | path | sftp. Keine Passwoerter hier, nur Pfade von Dateien (im Container).
      JULOS_BACKUP_COPY: "${JULOS_BACKUP_COPY:-off}"
      JULOS_BACKUP_COPY_PATH: "${JULOS_BACKUP_COPY_PATH:-}"
      JULOS_BACKUP_SFTP_HOST: "${JULOS_BACKUP_SFTP_HOST:-}"
      JULOS_BACKUP_SFTP_PORT: "${JULOS_BACKUP_SFTP_PORT:-}"
      JULOS_BACKUP_SFTP_USER: "${JULOS_BACKUP_SFTP_USER:-}"
      JULOS_BACKUP_SFTP_PATH: "${JULOS_BACKUP_SFTP_PATH:-}"
      JULOS_BACKUP_SFTP_KEY_FILE: "${JULOS_BACKUP_SFTP_KEY_FILE:-}"
      JULOS_BACKUP_SFTP_KEY_PASSPHRASE_FILE: "${JULOS_BACKUP_SFTP_KEY_PASSPHRASE_FILE:-}"
      JULOS_BACKUP_SFTP_PASSWORD_FILE: "${JULOS_BACKUP_SFTP_PASSWORD_FILE:-}"
      JULOS_BACKUP_SFTP_HOST_KEY: "${JULOS_BACKUP_SFTP_HOST_KEY:-}"
      # optional, nur lesen, standardmaessig aus (docs/MODULES.md): Caddy (Domains und Ziele) und DDNS (Adresse und Namen)
      JULOS_SERVICES: "${JULOS_SERVICES:-off}"
      JULOS_SERVICES_HOSTS: "${JULOS_SERVICES_HOSTS:-}"
      JULOS_CADDY: "${JULOS_CADDY:-off}"
      JULOS_CADDYFILE: "${JULOS_CADDYFILE:-}"
      JULOS_CADDY_ADMIN_URL: "${JULOS_CADDY_ADMIN_URL:-}"
      JULOS_CADDY_ADMIN_AUTH_FILE: "${JULOS_CADDY_ADMIN_AUTH_FILE:-}"
      JULOS_CADDY_TLS_CONNECT: "${JULOS_CADDY_TLS_CONNECT:-}"
      JULOS_CADDY_LOG_FILE: "${JULOS_CADDY_LOG_FILE:-}"
      JULOS_DDNS: "${JULOS_DDNS:-off}"
      JULOS_DDNS_HOSTS: "${JULOS_DDNS_HOSTS:-}"
      JULOS_DDNS_FRITZBOX_URL: "${JULOS_DDNS_FRITZBOX_URL:-}"
      JULOS_DDNS_IP_URL: "${JULOS_DDNS_IP_URL:-}"
      JULOS_DDNS_PROVIDER: "${JULOS_DDNS_PROVIDER:-}"
      JULOS_DDNS_CLOUDFLARE_ZONE: "${JULOS_DDNS_CLOUDFLARE_ZONE:-}"
      JULOS_DDNS_TOKEN_FILE: "${JULOS_DDNS_TOKEN_FILE:-}"
      JULOS_DDNS_UPDATE_URL: "${JULOS_DDNS_UPDATE_URL:-}"
      JULOS_DDNS_UPDATE_AUTH_FILE: "${JULOS_DDNS_UPDATE_AUTH_FILE:-}"
      JULOS_DDNS_AUTO: "${JULOS_DDNS_AUTO:-off}"
      JULOS_DDNS_AUTO_SECONDS: "${JULOS_DDNS_AUTO_SECONDS:-}"
      # Codex im eigenen Container (docs/CODEX-SIDECAR.md): JulOS spricht ihn nur ueber diesen Socket an. Ohne die Zeile (und den Dienst codex unten) laeuft Codex wie frueher im selben Container.
      JULOS_CODEX_SOCKET: /run/codex/codex.sock
    # Der Server muss als derselbe Benutzer laufen wie die grafische Sitzung der Ziel-Maschine (Agent-Socket, Foto-Ordner)
    user: "${JULOS_UID:-1000}:${JULOS_GID:-1000}"
    # die Gruppe des Codex-Sockets (codexsock im Image des Codex-Containers), damit der Server ihn oeffnen darf
    group_add:
      - "10002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Datenordner: hier legt der Server den Schluessel fuer gespeicherte Passwoerter an (secret.key). Ein benanntes Volume, damit er einen Neustart
      # und ein neues Image ueberlebt; julos-data-init gibt es dem Benutzer des Servers (nocopy, siehe unten). Nicht im Upload-Ordner (der ist die Wurzel des Dateibrowsers).
      - type: volume
        source: julos-data
        target: /data
        volume:
          nocopy: true   # sonst uebernimmt ein leeres Volume beim Start die Rechte des Image-Ordners (Benutzer "app") statt die von julos-data-init
      - ${HOME}/julos-uploads:/uploads
      # nur der Socket des Codex-Containers (sonst nichts)
      - codex_sock:/run/codex
      # Backup-Ordner: vorher anlegen (mkdir -m 700 ~/julos-backup), er gehoert dem Benutzer des Servers; Ablageort ausserhalb dieses Rechners mitnehmen
      - ${JULOS_BACKUP_PATH:-${HOME}/julos-backup}:/backup
      # Zweites Backup-Ziel, Beispiele (docs/BACKUP.md): eingebundenes NAS (JULOS_BACKUP_COPY=path, JULOS_BACKUP_COPY_PATH=/backup-copy), das Ziel gehoert dem Server-Benutzer, Rechte 0700
      # - /mnt/nas/julos-backup:/backup-copy
      # oder SFTP mit privatem Schluessel (JULOS_BACKUP_COPY=sftp, JULOS_BACKUP_SFTP_KEY_FILE=/run/secrets/julos-backup-sftp-key), die Datei nur lesend (0600, lesbar fuer JULOS_UID)
      # - ${HOME}/julos-backup-key:/run/secrets/julos-backup-sftp-key:ro
      # Caddy-Modul ueber das Caddyfile: die Datei nur lesend einbinden und JULOS_CADDYFILE=/etc/julos/Caddyfile setzen
      # - /pfad/zum/Caddyfile:/etc/julos/Caddyfile:ro
    # BIND_IP = LAN-Adresse des Docker-Hosts (nur Heimnetz); Standard ist nur lokal (127.0.0.1)
    ports:
      - "${BIND_IP:-127.0.0.1}:${BIND_PORT:-8080}:8080"
    # Haertung ohne Funktionsverlust (der Server bindet einen unprivilegierten Port und braucht keine Linux-Faehigkeiten); Grundlage: docs/SECURITY-REVIEW.md Nr. 16.
    # Optional, strenger: das Wurzeldateisystem schreibschuetzen. Geschrieben wird nur in /data, /uploads, /backup und /tmp; der Start und /api/health
    # sind so geprueft, ein voller Durchlauf (RDP mit GPU, Uploads, Sicherung) nicht. Darum steht es hier nur als Angebot (docs/DEVELOPMENT.md "Container hardening").
    # read_only: true
    # tmpfs:
    #   - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Gesundheitspruefung: der Server fragt sich selbst (Runtime-Image hat kein curl); gesund heisst: der Server antwortet und die Datenbank auch
    healthcheck:
      test: ["CMD", "dotnet", "JulOS.dll", "health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Codex im eigenen Container (docs/CODEX-SIDECAR.md): eigener Benutzer (10001), eigenes Volume fuer die ChatGPT-Anmeldung, kein Zugriff auf die Daten von JulOS, kein
  # veroeffentlichter Port, nicht im Netz von JulOS (braucht das Internet fuer OpenAI). JulOS erreicht ihn nur ueber den Socket im Volume codex_sock.
  codex:
    build:
      context: .
      dockerfile: deploy/codex/Dockerfile
    image: ghcr.io/juloc/julos-codex:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - codex_home:/home/codex
      - codex_sock:/run/codex
    mem_limit: 2g
    pids_limit: 512
    network_mode: bridge

  # Einmalig vor dem Server: gibt das Datenvolume dem Benutzer des Servers (ein neues Volume gehoert sonst dem Benutzer des Images und waere fuer ihn nicht beschreibbar).
  julos-data-init:
    image: postgres:18   # nur seiner Werkzeuge wegen (chown), ohnehin vorhanden
    user: "0:0"
    entrypoint: ["chown", "${JULOS_UID:-1000}:${JULOS_GID:-1000}", "/data"]
    volumes:
      - julos-data:/data
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

volumes:
  julos-postgres:
  julos-data:
  codex_home:
  codex_sock:
