# Test-Instanz: dieselbe Zusammenstellung wie live (Datenbank, Server aus demselben Dockerfile),
# dazu Wegwerf-Ziele zum Verbinden. Nur lokal erreichbar, eigene Datenbank, eigene Zugangsdaten (deploy/dev/up.sh erzeugt sie).
name: julos-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: julos
      POSTGRES_USER: julos
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?mit deploy/dev/up.sh starten}
    volumes:
      - julos-dev-postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:45432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julos -d julos"]
      interval: 3s
      timeout: 3s
      retries: 20

  julos:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      codex:
        condition: service_started
    environment:
      JULOS_DB: Host=postgres;Database=julos;Username=julos;Password=${DEV_DB_PASSWORD}
      JULOS_SECRET_KEY: ${DEV_SECRET_KEY:-}
      JULOS_RDP_GFX: ${DEV_RDP_GFX:-}            # Versuch: on = RDP-Grafikpipeline (GFX) einschalten (Standard aus)
      JULOS_CODEX_SOCKET: /run/codex/codex.sock  # Codex im eigenen Container (docs/CODEX-SIDECAR.md), siehe Dienst codex
    # wie live: der Server laeuft als derselbe Benutzer wie die Sitzung der Ziel-Maschine (Socket-Ordner hat Rechte 0700)
    user: "1020:1020"
    group_add:
      - "10002"
    volumes:
      - julos-dev-share:/uploads
      - julos-dev-codex-sock:/run/codex
    ports:
      - "127.0.0.1:18080:8080"

  # Codex im eigenen Container, wie live (docs/CODEX-SIDECAR.md): der Selbsttest der Trennung laeuft gegen genau diesen Dienst. Nur lokal, keine Anmeldung noetig fuer den Selbsttest.
  codex:
    build:
      context: ../..
      dockerfile: deploy/codex/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - julos-dev-codex-home:/home/codex
      - julos-dev-codex-sock:/run/codex
    mem_limit: 2g
    pids_limit: 512

  # Wegwerf-Ziel fuer das Terminal (SSH). Zugang: Benutzer "tester", Passwort aus deploy/dev/.env (DEV_TARGET_PASSWORD)
  test-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin
      USER_NAME: tester
      USER_PASSWORD: ${DEV_TARGET_PASSWORD}
      PASSWORD_ACCESS: "true"
    # nur lokal, damit die Tests (deploy/dev/test.sh) den SSH-Client des Servers gegen ein echtes Ziel pruefen koennen
    ports:
      - "127.0.0.1:42222:2222"

  # Wegwerf-Ziel fuer den Desktop (RDP mit xrdp und XFCE, wie die Linux-VM). Fester Test-Zugang "ubuntu" / "ubuntu";
  # es gibt keinen veroeffentlichten Port, nur der Server im selben Netz erreicht es (Host "rdp-target", Port 3389).
  rdp-target:
    build:
      context: ../..
      dockerfile: deploy/dev/rdp-target/Dockerfile
    hostname: rdp-target
    shm_size: 1g
    # Dateien in der Zwischenablage (xrdp haengt die Dateien des Clients per FUSE ein, "thinclient_drives"): nur fuer dieses Wegwerf-Ziel
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      # Agent-Socket und Foto-Upload, wie ~/julos-uploads auf der echten VM (der Server sieht denselben Ordner als /uploads)
      - julos-dev-share:/home/ubuntu/julos-uploads

volumes:
  julos-dev-codex-home:
  julos-dev-codex-sock:
  julos-dev-share:
  julos-dev-postgres:
