name: supply-chain

# Woechentlich, auch ohne Code-Aenderung: neue Schwachstellen in NuGet-Paketen (direkt und indirekt) kommen erst Wochen nach dem Release ans Licht.
# Schlaegt fehl, sobald ein Paket eine bekannte Schwachstelle hat (die Liste steht in der Zusammenfassung). Veraltete Pakete werden nur gemeldet.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Schwachstellen und veraltete Pakete
        run: |
          dotnet restore JulOS.slnx
          dotnet list JulOS.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          dotnet list JulOS.slnx package --outdated 2>&1 | tee outdated.txt
          {
            echo '### NuGet-Schwachstellen'; echo '```'; cat vulnerable.txt; echo '```'
            echo '### Veraltete direkte Pakete'; echo '```'; cat outdated.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'has the following vulnerable packages' vulnerable.txt; then
            echo "::error::Pakete mit bekannten Schwachstellen (siehe Zusammenfassung)"; exit 1
          fi
